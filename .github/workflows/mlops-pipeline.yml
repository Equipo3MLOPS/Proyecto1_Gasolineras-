name: MLOps - ETL y entrenamiento

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Data/**"
      - "annotations/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "Dockerfile"
      - ".github/workflows/mlops-pipeline.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "Data/**"
      - "annotations/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "Dockerfile"
      - ".github/workflows/mlops-pipeline.yml"
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:
    inputs:
      skip_eda:
        description: "Omitir el análisis exploratorio (EDA)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mlops-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  etl:
    name: ETL de gasolineras
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependencias del ETL
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Ejecutar extracción, EDA, transformación y carga
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_eda }}
        run: python -m src.pipeline

      - name: Ejecutar ETL sin EDA
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_eda }}
        run: python -m src.pipeline --no-eda

      - name: Validar dataset y base de datos generados
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          import pandas as pd

          dataset = Path("artifacts/gold/dataset_precios.csv")
          database = Path("db/gasolineras.db")
          silver = Path("artifacts/silver/fuel_prices_clean.csv")

          for artifact in (dataset, database, silver):
              if not artifact.exists():
                  raise SystemExit(f"No se generó el artefacto esperado: {artifact}")

          df = pd.read_csv(dataset)
          expected_fuels = {"diesel", "regular", "super", "v_power"}
          actual_fuels = set(df["tipo_combustible"].dropna().unique())
          if len(df) != 20:
              raise SystemExit(f"Se esperaban 20 filas en el dataset gold; se obtuvieron {len(df)}")
          if actual_fuels != expected_fuels:
              raise SystemExit(f"Combustibles inesperados: {sorted(actual_fuels)}")
          if df["precio_galon"].isna().any():
              raise SystemExit("El dataset gold contiene precios por galón nulos")

          with sqlite3.connect(database) as conn:
              rows = conn.execute("SELECT COUNT(*) FROM precios_combustible").fetchone()[0]
              if rows != len(df):
                  raise SystemExit(f"SQLite tiene {rows} filas y el CSV tiene {len(df)}")

          print(f"Validación correcta: {len(df)} filas, {len(actual_fuels)} combustibles y {rows} filas en SQLite")
          PY

      - name: Publicar artefactos del ETL
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: etl-artifacts-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/
            reports/eda_report.md
            reports/figures/
            db/gasolineras.db

  entrenamiento:
    name: Entrenamiento y evaluación
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio de entrenamiento
        uses: actions/checkout@v4
        with:
          repository: Equipo3MLOPS/MLOPS-Actividad1
          path: MLOPS-Actividad1

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: MLOPS-Actividad1/pyproject.toml

      - name: Instalar dependencias del pipeline de crédito
        working-directory: MLOPS-Actividad1
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Ejecutar preparación de datos, separación y KMeans
        working-directory: MLOPS-Actividad1
        run: credit-pipeline-demo | tee training.log

      - name: Publicar evidencia del entrenamiento
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: entrenamiento-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: MLOPS-Actividad1/training.log

  resumen:
    name: Resumen del pipeline
    runs-on: ubuntu-latest
    needs: [etl, entrenamiento]
    if: ${{ always() }}
    steps:
      - name: Comprobar resultados
        run: |
          echo "ETL: ${{ needs.etl.result }}"
          echo "Entrenamiento: ${{ needs.entrenamiento.result }}"
          if [ "${{ needs.etl.result }}" != "success" ] || [ "${{ needs.entrenamiento.result }}" != "success" ]; then
            echo "Una o más etapas del pipeline fallaron."
            exit 1
          fi
          echo "Pipeline MLOps completado correctamente."
