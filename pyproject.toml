[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gasolineras-pipeline"
version = "0.1.0"
description = "Pipeline ETL (fotos de surtidor -> SQLite) y calibracion de modelos de pronostico de precios"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "pillow>=10.0",
    "pillow_heif>=0.15",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
notebook = ["jupyter", "ipykernel"]

[project.scripts]
gasolineras-pipeline = "src.pipeline:main"

[tool.setuptools]
packages = ["src"]
