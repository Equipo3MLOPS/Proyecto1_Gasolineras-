# ===========================================================================
# Databricks Asset Bundle — pipeline medallón de gasolineras (equipo 3)
# ---------------------------------------------------------------------------
# Define, como código versionado, el Job que orquesta la medallón en Databricks:
#     extract → transform → load → model   (una tarea por etapa, en DAG)
# Las tareas corren en COMPUTE SERVERLESS (este workspace solo admite serverless).
#
# Despliegue:
#     databricks bundle validate -p uvg-mlops
#     databricks bundle deploy   -p uvg-mlops
#     databricks bundle run medallon_gasolineras -p uvg-mlops
#
# El backend de datos se elige con la variable `backend` (uc | s3). Correr la
# medallón de verdad requiere que el equipo tenga ESCRITURA en sus buckets
# (ver databricks/README.md).
# ===========================================================================
bundle:
  name: medallon_gasolineras

variables:
  backend:
    description: "Backend de datos: 'uc' (tablas Unity Catalog) o 's3' (Delta por ruta al bucket del equipo)."
    default: uc
  team:
    description: "Carpeta del equipo dentro de los buckets (equipo0..equipo7)."
    default: equipo3

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-a56ba7f1-976e.cloud.databricks.com

resources:
  jobs:
    medallon_gasolineras:
      name: "Medallón Gasolineras — ${var.team}"

      # Sin job_clusters: cada tarea corre en serverless. Las dependencias que no
      # trae el runtime (pillow-heif para leer .HEIC) se instalan dentro del
      # notebook con %pip (ver databricks/run_stage.py).
      tasks:
        - task_key: extract
          notebook_task:
            notebook_path: ./databricks/run_stage.py
            base_parameters:
              stage: extract
              backend: ${var.backend}
              team: ${var.team}

        - task_key: transform
          depends_on:
            - task_key: extract
          notebook_task:
            notebook_path: ./databricks/run_stage.py
            base_parameters:
              stage: transform
              backend: ${var.backend}
              team: ${var.team}

        - task_key: load
          depends_on:
            - task_key: transform
          notebook_task:
            notebook_path: ./databricks/run_stage.py
            base_parameters:
              stage: load
              backend: ${var.backend}
              team: ${var.team}

        - task_key: model
          depends_on:
            - task_key: load
          notebook_task:
            notebook_path: ./databricks/run_stage.py
            base_parameters:
              stage: model
              backend: ${var.backend}
              team: ${var.team}
